name: Publish to npm

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Publishing waits for the same checks that run on pull requests
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    # id-token lets npm record which workflow run and commit built the package (provenance)
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # The tarball that `checks` built and ran the package check on. Nothing is installed or built
      # here, so the published file is the tested one.
      - name: Download the verified package
        uses: actions/download-artifact@v4
        with:
          name: package
          path: package

      - name: Publish to npm
        # `./` matters: without it npm reads `package/x.tgz` as a GitHub `owner/repo` shorthand.
        run: npm publish ./package/*.tgz --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Tags the published commit and creates its GitHub Release from the CHANGELOG.md section. It is a
  # separate job so a failure here can be re-run on its own: re-running `publish` would fail,
  # because npm refuses a duplicate version.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists, nothing to do"
            exit 0
          fi

          awk -v v="$version" 'index($0, "## " v " ") == 1 { found = 1; next } /^## / && found { exit } found' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$version"
          git push origin "$tag"
          gh release create "$tag" --verify-tag --latest --title "$tag" --notes-file release-notes.md

  # Deploys the Storybook built and tested in `checks`. It does not wait for publish, so a
  # failed npm publish does not block the docs.
  deploy-docs:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
