name: CI

# Runs on PRs and is called by main.yml before publishing, so pushes to main are not
# a trigger here (they would run the checks twice).
on:
  pull_request:
  workflow_call:

# Cancel superseded runs of the same PR; never cancel runs on main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Every push to main publishes, so the version on main is the published one.
      # Skipped on push to main, where it would race with the publish workflow.
      - name: Check version bump
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          base=$(git show FETCH_HEAD:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          head=$(node -p "require('./package.json').version")
          if [ "$base" = "$head" ]; then
            echo "::error::Version $head is already on $BASE_REF. Run: npm version <patch|minor> --no-git-tag-version"
            exit 1
          fi
          echo "Version $base -> $head"

      # The release job takes the GitHub Release notes from this section, so a missing one is
      # caught here instead of after the package is published.
      - name: Check changelog entry
        if: github.event_name == 'pull_request'
        run: |
          version=$(node -p "require('./package.json').version")
          if ! awk -v v="$version" 'index($0, "## " v " ") == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section. Add it in the version bump commit."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # Runs the `prepare` script too, so build and tsc errors fail here
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npx prettier --check ./src ./.storybook

      - name: Build Storybook
        run: npm run build-storybook

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      # Only on main: the deploy job in main.yml publishes exactly this tested build.
      # Last step, so the artifact exists only if every check above passed.
      - name: Upload Storybook for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  # Checks the package a consumer installs, not the source: lint rules and Storybook cannot see a
  # missing `.js` extension, a wrong `exports` entry or a stray "use client". Runs in parallel
  # with `checks` and needs no browser, so it adds no time to the pipeline.
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test the packed package
        run: npm run test:package

      # Only on main: the publish job in main.yml publishes exactly this file, so what reaches npm is
      # the package that was built and checked here, not a second build of the same commit. Packed
      # right after the package check passes, from the same build output.
      - name: Pack the verified package
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"

      - name: Upload the verified package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7
