name: CI

# Runs on PRs and is called by main.yml before publishing, so pushes to main are not
# a trigger here (they would run the checks twice).
on:
  pull_request:
  workflow_call:

# Cancel superseded runs of the same PR; never cancel runs on main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Every push to main publishes, so the version on main is the published one.
      # Skipped on push to main, where it would race with the publish workflow.
      - name: Check version bump
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          base=$(git show FETCH_HEAD:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          head=$(node -p "require('./package.json').version")
          if [ "$base" = "$head" ]; then
            echo "::error::Version $head is already on $BASE_REF. Run: npm version <patch|minor> --no-git-tag-version"
            exit 1
          fi
          echo "Version $base -> $head"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # Runs the `prepare` script too, so build and tsc errors fail here
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npx prettier --check ./src

      - name: Build Storybook
        run: npm run build-storybook

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test
